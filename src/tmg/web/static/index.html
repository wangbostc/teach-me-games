<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tmg -- play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css" />
  <!--
    three.js loads from unpkg at a pinned version with no Subresource
    Integrity check. Both are accepted here, not fixed: this app binds to
    127.0.0.1 only (tmg.web.app.run), so the CDN dependency and the absent
    integrity hash are a localhost-tool tradeoff, not a public-site one. If
    that ever stops being true, vendor three.js into a checked-in
    static/vendor/ instead of adding integrity hashes to a CDN URL.

    "three/addons/" is the ONLY place the addon path is pinned. board3d.js
    imports OrbitControls and RoomEnvironment by bare specifier through
    this entry rather than a second hardcoded unpkg URL -- two independent
    pins on the same three.js version drift apart the moment either one is
    bumped alone, and the result (two loaded copies of three.js) fails in
    ways that are very hard to diagnose. Bump the version here and both
    imports move together.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">tmg</h1>
    <p class="tagline">a quiet study board</p>
    <p id="matchup" class="matchup-line"></p>
  </header>

  <main>
    <section id="setup" class="card">
      <h2>New game</h2>
      <div class="field-row">
        <label class="field">
          <span>Side</span>
          <select id="side">
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </label>
        <label class="field">
          <span>Difficulty</span>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label class="field">
          <span>Your army</span>
          <select id="faction"></select>
        </label>
      </div>
      <p class="field-note">
        The opponent always fields a different army, picked at random.
      </p>
      <label class="checkbox-field">
        <input type="checkbox" id="learning-mode" />
        <span
          >Learning mode
          <small>See the engine's top moves explained as you play, instead of moving freely.</small></span
        >
      </label>
      <button id="start" class="btn-primary">Start game</button>
    </section>

    <section id="game" class="game-layout" hidden>
      <div class="board-column">
        <div id="board3d" class="board-stage"></div>
        <p id="status" class="status-line"></p>
      </div>
      <aside class="notebook">
        <div id="options" class="options-stack" hidden></div>
      </aside>
    </section>

    <section id="report" class="card report-card" hidden>
      <h2>Report</h2>
      <pre id="report-text"></pre>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
